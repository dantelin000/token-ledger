[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenledger-desktop"
dynamic = ["version"]
description = "Local native desktop token usage ledger with extensible harness adapters"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["tzdata>=2026.1"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Topic :: System :: Monitoring",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.22,<7"]
dmg = ["dmgbuild==1.6.7; sys_platform == 'darwin'"]

[project.gui-scripts]
tokenledger = "tokenlog.desktop:main"

[project.urls]
Repository = "https://github.com/dantelin000/token-ledger"
Issues = "https://github.com/dantelin000/token-ledger/issues"
Downloads = "https://github.com/dantelin000/token-ledger/releases"

[tool.setuptools]
packages = ["tokenlog"]

[tool.setuptools.dynamic]
version = {attr = "tokenlog.__version__"}
